[package]
name = "desktop-app-starter-kit-tauri"
version = "0.1.0"
description = "Desktop App Starter Kit - Tauri: a free, MIT-licensed Tauri v2 + React + TypeScript + Tailwind starter built for Claude Code."
authors = ["Desktop App Starter Kit - Tauri contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
keywords = ["tauri", "starter", "react", "typescript", "desktop"]

[lib]
name = "desktop_app_starter_kit_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = "0.7"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
base64 = "0.22"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
